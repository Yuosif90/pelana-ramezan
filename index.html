  <script>
    /* always live on the main address, so the session is kept and long Vercel links never show */
    (function () {
      try {
        var C = 'www.plana-ramazane.site', h = location.hostname;
        if (h !== C && /\.vercel\.app$|\.github\.io$/.test(h)) {
          fetch('https://' + C + '/config.js', { cache: 'no-store' }).then(function (r) { return r.ok ? r.text() : ''; }).then(function (x) {
            if (x.indexOf('RM_CONFIG') > -1) location.replace('https://' + C + location.pathname.replace(/^\/pelana-ramezan/, '') + location.search + location.hash);
          }).catch(function () {});
        }
      } catch (e) {}
    })();
  </script>
